{% extends "layout.html" %}
{% block content %}
<h2>Dashboard</h2>
<div class="row text-center">
  {% for k,v in stats.items() %}
    <div class="col-md-3 mb-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-capitalize">{{ k }}</h5>
          <p class="display-6">{{ v }}</p>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
